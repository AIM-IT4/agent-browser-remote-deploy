[project]
name = "agent-browser-remote"
version = "0.1.0"
description = "Remote MCP server (streamable HTTP) that drives Vercel's agent-browser CLI in a memory-capped container"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4"
dependencies = [
    "fastmcp>=3.0",
]

[project.scripts]
agent-browser-remote = "agent_browser_remote.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_browser_remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
